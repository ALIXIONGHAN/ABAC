<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🐑 羊了个羊 - 终极美化版</title>
    <style>
        /* ==================== CSS 变量与主题系统 ==================== */
        :root {
            --tile-size: 48px;
            --dock-height: 80px;
            --transition-speed: 0.3s;
        }

        [data-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            --text-color: #2e7d32;
            --board-bg: rgba(255,255,255,0.25);
            --board-border: rgba(255,255,255,0.5);
            --tile-bg: linear-gradient(145deg, #ffffff, #f5f5f5);
            --tile-shadow: 0 3px 0 #bcaaa4, 0 4px 6px rgba(0,0,0,0.1);
            --tile-shadow-active: 0 1px 0 #bcaaa4, 0 2px 3px rgba(0,0,0,0.1);
            --dock-wrapper-bg: rgba(255,255,255,0.3);
            --dock-bg: linear-gradient(180deg, #8d6e63, #5d4037);
            --modal-bg: white;
            --modal-text: #333;
            --modal-sub: #888;
            --btn-bg: linear-gradient(135deg, #66bb6a, #2e7d32);
            --btn-shadow: rgba(46,125,50,0.3);
            --progress-bg: rgba(255,255,255,0.6);
            --progress-fill: #66bb6a;
            --particle-color: #ffd700;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            --text-color: #e0e0e0;
            --board-bg: rgba(255,255,255,0.05);
            --board-border: rgba(255,255,255,0.1);
            --tile-bg: linear-gradient(145deg, #2d2d44, #252538);
            --tile-shadow: 0 3px 0 #1a1a2e, 0 4px 6px rgba(0,0,0,0.3);
            --tile-shadow-active: 0 1px 0 #1a1a2e, 0 2px 3px rgba(0,0,0,0.3);
            --dock-wrapper-bg: rgba(255,255,255,0.08);
            --dock-bg: linear-gradient(180deg, #3d3d5c, #2a2a40);
            --modal-bg: #2d2d44;
            --modal-text: #eee;
            --modal-sub: #aaa;
            --btn-bg: linear-gradient(135deg, #7c4dff, #536dfe);
            --btn-shadow: rgba(124,77,255,0.3);
            --progress-bg: rgba(255,255,255,0.1);
            --progress-fill: #7c4dff;
            --particle-color: #ff6ec7;
        }

        [data-theme="festival"] {
            --bg-gradient: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 50%, #ffccbc 100%);
            --text-color: #bf360c;
            --board-bg: rgba(255,255,255,0.3);
            --board-border: rgba(255,200,200,0.5);
            --tile-bg: linear-gradient(145deg, #fff8e1, #ffecb3);
            --tile-shadow: 0 3px 0 #e65100, 0 4px 6px rgba(230,81,0,0.15);
            --tile-shadow-active: 0 1px 0 #e65100, 0 2px 3px rgba(230,81,0,0.15);
            --dock-wrapper-bg: rgba(255,255,255,0.35);
            --dock-bg: linear-gradient(180deg, #e65100, #bf360c);
            --modal-bg: #fff8e1;
            --modal-text: #bf360c;
            --modal-sub: #e65100;
            --btn-bg: linear-gradient(135deg, #ff6f00, #e65100);
            --btn-shadow: rgba(230,81,0,0.3);
            --progress-bg: rgba(255,255,255,0.6);
            --progress-fill: #ff6f00;
            --particle-color: #ff1744;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 0;
            background: var(--bg-gradient);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
            user-select: none;
            transition: background var(--transition-speed) ease;
        }

        /* --- 顶部栏 --- */
        .header {
            display: flex; align-items: center; gap: 12px;
            margin-bottom: 10px; z-index: 10; width: 340px;
            justify-content: space-between;
        }
        .header h1 {
            margin: 0; font-size: 1.4rem; color: var(--text-color);
            text-shadow: 0 1px 2px rgba(255,255,255,0.3);
            transition: color var(--transition-speed);
        }
        .header-controls { display: flex; gap: 8px; align-items: center; }
        
        .theme-btn, .level-btn {
            width: 36px; height: 36px; border-radius: 50%;
            border: 2px solid var(--board-border);
            background: var(--board-bg);
            cursor: pointer; font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; backdrop-filter: blur(4px);
        }
        .theme-btn:hover, .level-btn:hover { transform: scale(1.1); }
        .level-badge {
            font-size: 0.75rem; font-weight: 700; color: var(--text-color);
            background: var(--board-bg); padding: 4px 10px; border-radius: 12px;
            border: 1px solid var(--board-border); backdrop-filter: blur(4px);
        }

        .progress-bar {
            width: 100px; height: 8px; background: var(--progress-bg);
            border-radius: 10px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; width: 0%; background: var(--progress-fill);
            transition: width 0.3s ease, background var(--transition-speed); border-radius: 10px;
        }

        /* --- 游戏区 --- */
        #game-area {
            position: relative;
            width: 340px; height: 380px;
            background: var(--board-bg);
            border-radius: 20px;
            backdrop-filter: blur(4px);
            border: 1px solid var(--board-border);
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.03);
            margin-bottom: 14px; z-index: 1;
            transition: background var(--transition-speed), border-color var(--transition-speed);
        }

        .tile {
            width: var(--tile-size); height: var(--tile-size);
            background: var(--tile-bg);
            border: none; border-radius: 10px;
            position: absolute;
            display: flex; justify-content: center; align-items: center;
            font-size: 26px; line-height: 1;
            cursor: pointer;
            box-shadow: var(--tile-shadow);
            transition: transform 0.15s ease, filter 0.2s ease, opacity 0.2s ease, background var(--transition-speed);
            will-change: transform, left, top;
        }
        .tile:active:not(.covered) {
            transform: translateY(2px);
            box-shadow: var(--tile-shadow-active);
        }
        .tile.covered {
            filter: brightness(0.5) saturate(0.5);
            cursor: default; pointer-events: none;
        }
        .tile.matched { animation: matchPop 0.3s ease forwards; }
        @keyframes matchPop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.25); opacity: 0.8; }
            100% { transform: scale(0); opacity: 0; }
        }

        /* --- 卡槽 --- */
        #dock-wrapper {
            position: relative; z-index: 100;
            padding: 6px; border-radius: 18px;
            background: var(--dock-wrapper-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--board-border);
            transition: background var(--transition-speed);
        }
        #dock {
            width: 370px; height: var(--dock-height);
            background: var(--dock-bg);
            border-radius: 14px;
            display: flex; justify-content: center; align-items: center;
            gap: 4px; padding: 0 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.15);
            transition: background var(--transition-speed);
        }
        #dock .tile {
            position: static !important; left: auto !important; top: auto !important;
            box-shadow: 0 2px 0 rgba(0,0,0,0.15), 0 3px 6px rgba(0,0,0,0.1);
            margin: 0; flex-shrink: 0;
        }

        /* --- 粒子容器 --- */
        #particles { position: fixed; inset: 0; pointer-events: none; z-index: 500; }
        .particle {
            position: absolute; border-radius: 50%; pointer-events: none;
            animation: particleFly 0.6s ease-out forwards;
        }
        @keyframes particleFly {
            0% { transform: translate(0,0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
        }

        /* --- 弹窗 --- */
        #modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(6px);
            display: none; justify-content: center; align-items: center;
            z-index: 999; opacity: 0; transition: opacity 0.3s ease;
        }
        #modal-overlay.show { display: flex; opacity: 1; }
        .modal-card {
            background: var(--modal-bg); border-radius: 24px; padding: 36px 40px;
            text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), background var(--transition-speed);
        }
        #modal-overlay.show .modal-card { transform: scale(1); }
        .modal-card h2 { margin: 0 0 8px; font-size: 1.8rem; color: var(--text-color); }
        .modal-card p { margin: 0 0 24px; color: var(--modal-sub); font-size: 0.95rem; }
        .btn-restart {
            padding: 14px 48px; font-size: 1.1rem; font-weight: 700;
            background: var(--btn-bg); color: white; border: none; border-radius: 50px;
            cursor: pointer; box-shadow: 0 4px 15px var(--btn-shadow);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .btn-restart:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--btn-shadow); }
        .btn-restart:active { transform: translateY(0); }
    </style>
</head>
<body>
    <div id="particles"></div>

    <div class="header">
        <h1>🐑 羊了个羊</h1>
        <div class="header-controls">
            <span class="level-badge" id="level-badge">Lv.1 随机</span>
            <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
            <button class="level-btn" onclick="nextLevel()" title="下一关">🗺️</button>
            <button class="theme-btn" onclick="toggleTheme()" title="切换主题" id="theme-icon">🌙</button>
        </div>
    </div>

    <div id="game-area"></div>

    <div id="dock-wrapper"><div id="dock"></div></div>

    <div id="modal-overlay">
        <div class="modal-card">
            <h2 id="msg-title">🎉 通关啦！</h2>
            <p id="msg-desc">你太厉害了！</p>
            <button class="btn-restart" onclick="initGame()">再玩一次</button>
        </div>
    </div>

<script>
// ==================== 🔊 Web Audio 合成音效引擎 ====================
const AudioEngine = (() => {
    let ctx = null;
    const getCtx = () => {
        if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        return ctx;
    };

    function playTone(freq, type, duration, vol = 0.15) {
        try {
            const c = getCtx();
            const osc = c.createOscillator();
            const gain = c.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, c.currentTime);
            gain.gain.setValueAtTime(vol, c.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + duration);
            osc.connect(gain);
            gain.connect(c.destination);
            osc.start();
            osc.stop(c.currentTime + duration);
        } catch(e) {}
    }

    return {
        click: () => playTone(800, 'sine', 0.08, 0.1),
        match: () => {
            playTone(523.25, 'sine', 0.15, 0.12);   // C5
            setTimeout(() => playTone(659.25, 'sine', 0.15, 0.12), 80);  // E5
            setTimeout(() => playTone(783.99, 'sine', 0.25, 0.12), 160); // G5
        },
        win: () => {
            [523.25, 659.25, 783.99, 1046.50].forEach((f, i) =>
                setTimeout(() => playTone(f, 'triangle', 0.3, 0.1), i * 120)
            );
        },
        lose: () => {
            playTone(300, 'sawtooth', 0.3, 0.08);
            setTimeout(() => playTone(200, 'sawtooth', 0.4, 0.08), 200);
        }
    };
})();

// ==================== ✨ 粒子特效系统 ====================
function spawnParticles(x, y, count = 8) {
    const container = document.getElementById('particles');
    const color = getComputedStyle(document.documentElement).getPropertyValue('--particle-color').trim();
    for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = 4 + Math.random() * 6;
        const angle = (Math.PI * 2 / count) * i + Math.random() * 0.5;
        const dist = 30 + Math.random() * 40;
        const dx = Math.cos(angle) * dist;
        const dy = Math.sin(angle) * dist;
        p.style.cssText = `
            left:${x}px; top:${y}px; width:${size}px; height:${size}px;
            background:${color}; --dx:${dx}px; --dy:${dy}px;
        `;
        container.appendChild(p);
        setTimeout(() => p.remove(), 600);
    }
}

// ==================== 🎨 主题系统 ====================
const THEMES = ['light', 'dark', 'festival'];
const THEME_ICONS = { light: '🌙', dark: '🎄', festival: '☀️' };
let currentThemeIdx = 0;

function toggleTheme() {
    currentThemeIdx = (currentThemeIdx + 1) % THEMES.length;
    document.documentElement.setAttribute('data-theme', THEMES[currentThemeIdx]);
    document.getElementById('theme-icon').textContent = THEME_ICONS[THEMES[currentThemeIdx]];
    AudioEngine.click();
}

// ==================== 🗺️ 关卡布局系统 ====================
const LEVELS = [
    {
        name: '随机',
        groups: 12,
        layout: (w, h, ts) => ({
            x: Math.random() * (w - ts),
            y: Math.random() * (h - ts),
            z: Math.floor(Math.random() * 30)
        })
    },
    {
        name: '❤️ 心形',
        groups: 14,
        layout: (w, h, ts, idx, total) => {
            const t = (idx / total) * Math.PI * 2;
            // 心形参数方程
            const hx = 16 * Math.pow(Math.sin(t), 3);
            const hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            const scale = 8;
            const cx = w / 2 - ts / 2, cy = h / 2 - ts / 2 - 20;
            return {
                x: Math.max(0, Math.min(w - ts, cx + hx * scale + (Math.random()-0.5)*12)),
                y: Math.max(0, Math.min(h - ts, cy + hy * scale + (Math.random()-0.5)*12)),
                z: idx
            };
        }
    },
    {
        name: '⭐ 星形',
        groups: 15,
        layout: (w, h, ts, idx, total) => {
            const points = 5;
            const outerR = 130, innerR = 55;
            const angleStep = (Math.PI * 2) / (points * 2);
            const segIdx = idx % (points * 2);
            const r = segIdx % 2 === 0 ? outerR : innerR;
            const baseAngle = segIdx * angleStep - Math.PI / 2;
            // 在每条射线上随机分布
            const linePos = 0.3 + Math.random() * 0.7;
            const px = Math.cos(baseAngle) * r * linePos;
            const py = Math.sin(baseAngle) * r * linePos;
            const cx = w / 2 - ts / 2, cy = h / 2 - ts / 2;
            return {
                x: Math.max(0, Math.min(w - ts, cx + px + (Math.random()-0.5)*10)),
                y: Math.max(0, Math.min(h - ts, cy + py + (Math.random()-0.5)*10)),
                z: idx
            };
        }
    },
    {
        name: '🍀 四叶草',
        groups: 16,
        layout: (w, h, ts, idx, total) => {
            const t = (idx / total) * Math.PI * 2;
            // 四叶玫瑰线 r = cos(2θ)
            const r = Math.abs(Math.cos(2 * t)) * 130;
            const px = r * Math.cos(t);
            const py = r * Math.sin(t);
            const cx = w / 2 - ts / 2, cy = h / 2 - ts / 2;
            return {
                x: Math.max(0, Math.min(w - ts, cx + px + (Math.random()-0.5)*14)),
                y: Math.max(0, Math.min(h - ts, cy + py + (Math.random()-0.5)*14)),
                z: idx
            };
        }
    }
];

let currentLevelIdx = 0;

function nextLevel() {
    currentLevelIdx = (currentLevelIdx + 1) % LEVELS.length;
    AudioEngine.click();
    initGame();
}

// ==================== 🎮 核心游戏逻辑 ====================
const TILE_TYPES = ['🐑','🥕','🔥','🌲','🧶','✂️','🧀','🍄','🎵','💎'];
const DOCK_CAPACITY = 7;
const BOARD_W = 340, BOARD_H = 380, TILE_SIZE = 48;

let tilesData = [], dockTiles = [], totalTiles = 0;

const $area = document.getElementById('game-area');
const $dock = document.getElementById('dock');
const $modal = document.getElementById('modal-overlay');
const $title = document.getElementById('msg-title');
const $desc  = document.getElementById('msg-desc');
const $progress = document.getElementById('progress');
const $levelBadge = document.getElementById('level-badge');

function initGame() {
    tilesData = []; dockTiles = [];
    $area.innerHTML = ''; $dock.innerHTML = '';
    $modal.classList.remove('show');

    const level = LEVELS[currentLevelIdx];
    $levelBadge.textContent = `Lv.${currentLevelIdx + 1} ${level.name}`;

    // 生成牌池
    let pool = [];
    for (let i = 0; i < level.groups; i++) {
        const t = TILE_TYPES[i % TILE_TYPES.length];
        pool.push(t, t, t);
    }
    shuffle(pool);
    totalTiles = pool.length;

    // 按关卡布局创建卡牌
    pool.forEach((type, idx) => createTile(type, idx, pool.length, level));

    updateCoverStatus();
    updateProgress();
}

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
}

function createTile(type, index, total, level) {
    const el = document.createElement('div');
    el.className = 'tile';
    el.textContent = type;

    const pos = level.layout(BOARD_W, BOARD_H, TILE_SIZE, index, total);
    el.style.left = `${pos.x}px`;
    el.style.top  = `${pos.y}px`;
    el.style.zIndex = 10 + pos.z;

    const tile = { id: index, type, el, x: pos.x, y: pos.y, zIndex: 10 + pos.z, inDock: false };
    el.onclick = () => onTileClick(tile);
    $area.appendChild(el);
    tilesData.push(tile);
}

function updateCoverStatus() {
    const field = tilesData.filter(t => !t.inDock);
    field.forEach(a => {
        const covered = field.some(b => b !== a && b.zIndex > a.zIndex && isOverlap(a, b));
        a.el.classList.toggle('covered', covered);
    });
}

function isOverlap(a, b) {
    const s = 6;
    return !(a.x + TILE_SIZE - s <= b.x + s || a.x + s >= b.x + TILE_SIZE - s ||
             a.y + TILE_SIZE - s <= b.y + s || a.y + s >= b.y + TILE_SIZE - s);
}

function onTileClick(tile) {
    if (tile.el.classList.contains('covered') || tile.inDock || dockTiles.length >= DOCK_CAPACITY) return;
    
    AudioEngine.click();
    tile.inDock = true;

    let insertIdx = dockTiles.length;
    for (let i = dockTiles.length - 1; i >= 0; i--) {
        if (dockTiles[i].type === tile.type) { insertIdx = i + 1; break; }
    }
    dockTiles.splice(insertIdx, 0, tile);

    renderDock();
    updateCoverStatus();
    updateProgress();

    setTimeout(() => { checkMatch(); checkGameState(); }, 180);
}

function renderDock() {
    $dock.innerHTML = '';
    dockTiles.forEach(t => {
        t.el.style.position = 'static';
        t.el.style.left = 'auto'; t.el.style.top = 'auto';
        t.el.style.zIndex = 'auto';
        t.el.classList.remove('covered');
        $dock.appendChild(t.el);
    });
}

function checkMatch() {
    const counts = {};
    dockTiles.forEach(t => counts[t.type] = (counts[t.type] || 0) + 1);
    for (const type in counts) {
        if (counts[type] >= 3) { removeTiles(type); return; }
    }
}

function removeTiles(type) {
    AudioEngine.match();
    let removed = 0;
    const newDock = [];
    dockTiles.forEach(t => {
        if (t.type === type && removed < 3) {
            // 获取屏幕坐标用于粒子
            const rect = t.el.getBoundingClientRect();
            spawnParticles(rect.left + rect.width/2, rect.top + rect.height/2, 10);
            t.el.classList.add('matched');
            setTimeout(() => t.el.remove(), 300);
            removed++;
        } else {
            newDock.push(t);
        }
    });
    dockTiles = newDock;
    setTimeout(() => { updateProgress(); checkGameState(); }, 320);
}

function updateProgress() {
    const remaining = tilesData.filter(t => !t.inDock).length + dockTiles.length;
    const pct = Math.max(0, ((totalTiles - remaining) / totalTiles) * 100);
    $progress.style.width = `${pct}%`;
}

function checkGameState() {
    const fieldLeft = tilesData.filter(t => !t.inDock).length;
    if (fieldLeft === 0 && dockTiles.length === 0) {
        AudioEngine.win();
        showModal(true);
    } else if (dockTiles.length >= DOCK_CAPACITY) {
        AudioEngine.lose();
        showModal(false);
    }
}

function showModal(win) {
    $title.textContent = win ? '🎉 通关啦！' : '😢 槽位已满';
    $desc.textContent = win
        ? `「${LEVELS[currentLevelIdx].name}」关卡完成！`
        : '别灰心，换个策略再试一次吧！';
    $modal.classList.add('show');
}

// 首次初始化需要用户交互才能激活AudioContext，这里静默启动
initGame();
</script>
</body>
</html>
